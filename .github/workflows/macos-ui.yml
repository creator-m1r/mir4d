name: Build macOS UI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-ui:
    name: Build SwiftUI interface on macOS
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build SwiftUI application
        run: swift build -c debug
