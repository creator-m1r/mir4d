      - "/opt/homebrew/include"
    GCC_PREPROCESSOR_DEFINITIONS:
      - "MIR_ENABLE_OCCT=0"
    OTHER_LDFLAGS:
      - "-L/opt/homebrew/lib"
      - "-lassimp"
