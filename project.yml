      - path: MirEngine/IO/Commands/MeshImportCommandHandler.cpp
      - path: MirEngine/IO/Step/OcctBridge.cpp
      - path: MirEngine/IO/Step/StepImporter.cpp
      - path: MirEngine/IO/Step/StepExporter.cpp
      - path: MirEngine/Rendering/DocumentSceneRenderBridge.cpp
      # ── C++ UI core + bridge ─────────────────────────────────
      - path: MirUI/Core/Transform/TransformAdapter.cpp
      - path: MirUI/Core/Widget/Widget.cpp
      - path: MirUI/Interop/MIR4DEngineDocumentBridge.cpp
      - path: MirUI/Interop/SelectionEventBridge.cpp
      - path: MirUI/Interop/SelectionInspectorBridge.cpp
      - path: MirUI/Widgets/PropertyGrid/RenderSelectionPropertyAdapter.cpp
      - path: MirUI/Widgets/PropertyGrid/SelectionInspectorModel.cpp
    resources:
      - path: MirUI/App/UIConfig
      - path: MirUI/Renderers/SwiftUI/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mir4d.app
        PRODUCT_NAME: MIR 4D
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHighResolutionCapable: true
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        SWIFT_OBJC_BRIDGING_HEADER: MirUI/Renderers/SwiftUI/MirEngine-Bridging-Header.h
        GCC_PREPROCESSOR_DEFINITIONS:
          - "MIR_ENABLE_OCCT=0"
          - "GL_SILENCE_DEPRECATION=1"
        CLANG_WARN_DOCUMENTATION_COMMENTS: false
        ENABLE_HARDENED_RUNTIME: false
        CLANG_ENABLE_OBJC_ARC: false
