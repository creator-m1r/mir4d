# MIR 4D — Xcode project generated by XcodeGen.
# Regenerate after changing sources: xcodegen generate
name: MIR4D
options:
  bundleIdPrefix: com.mir4d
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++23"
    CLANG_CXX_LIBRARY: "libc++"
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)"
      - "$(SRCROOT)/MirEngine/BRep"
      - "$(SRCROOT)/MirEngine/BRep/Core"
      - "$(SRCROOT)/MirEngine/BRep/Topology"
      - "$(SRCROOT)/MirEngine/BRep/Geometry"
      - "$(SRCROOT)/MirEngine/BRep/Builders"
      - "$(SRCROOT)/MirEngine/BRep/Tessellator"
      - "$(SRCROOT)/MirEngine/BRep/Boolean"
      - "$(SRCROOT)/MirEngine/BRep/Converters"
      - "$(SRCROOT)/MirEngine/BRep/Commands"
      - "$(SRCROOT)/MirEngine/BRep/Validator"
      - "/opt/homebrew/include"
    GCC_PREPROCESSOR_DEFINITIONS:
      - "MIR_ENABLE_OCCT=0"
    OTHER_LDFLAGS:
      - "-lc++"
      - "-L/opt/homebrew/lib"
      - "-lassimp"
targets:
  MIR4DApp:
    type: application
    platform: macOS
    sources:
      # ── Swift UI ─────────────────────────────────────────────
      - path: MirUI/App
        excludes:
          - "UIConfig/*.json"
      - path: MirUI/Renderers/SwiftUI
