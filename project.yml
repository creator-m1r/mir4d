          - MirEngineApp.swift
          - MirUICppBridge.mm
          - SwiftUIRenderer.mm
          - "*.hpp"
          - "*.h"
          - "README_BUILD.md"
          - "Resources"
      # ── C++ engine sources ───────────────────────────────────
      - path: MirEngine/Core/Exports/MirEngineExports.cpp
      - path: MirEngine/Core/Logging/Logger.cpp
      - path: MirEngine/Rendering/OpenGL/OpenGLRenderer.cpp
      - path: MirEngine/Rendering/OpenGL/OpenGLCapabilities.cpp
      - path: MirEngine/Rendering/OpenGL/OpenGLDebug.cpp
      - path: MirEngine/Rendering/OpenGL/OpenGLDevice.cpp
      - path: MirEngine/Rendering/OpenGL/OpenGLIndexBuffer.cpp
      - path: MirEngine/Rendering/OpenGL/OpenGLShader.cpp
      - path: MirEngine/Rendering/OpenGL/OpenGLState.cpp
      - path: MirEngine/Rendering/OpenGL/OpenGLVertexArray.cpp
      - path: MirEngine/Rendering/OpenGL/OpenGLVertexBuffer.cpp
      - path: MirEngine/Rendering/Passes/GridPass.cpp
      - path: MirEngine/Rendering/Passes/GeometryPass.cpp
